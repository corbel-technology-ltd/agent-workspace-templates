# placeholders.yml — onboarding placeholder registry + allowlist (SSOT)
#
# This file is the single source of truth (SSOT) for the onboarding-fill tokens of a
# Shared-Context shared-context store. `apply.py` reads THIS file (via PyYAML) together with
# `values.json` (the per-store answers), then substitutes every `<<NAME>>` occurrence
# across the git-tracked tree. Nothing else defines the token set: the README, SHARED.md,
# and the onboarding interview all defer to the `tokens:` list below. Add a token here or
# nowhere.
#
# Two distinct marker syntaxes live in the template; only ONE is filled here:
#   <<NAME>>  — onboarding-fill tokens. Replaced ONCE at instantiation by apply.py.
#               The six entries under `tokens:` are the ONLY <<...>> markers apply.py fills.
#   {{...}}   — runtime markers (e.g. {{YYYY-MM-DD}} in the _templates). Filled
#               per-artefact, NEVER by apply.py. Left untouched.
#
# The generic literal `<<TOKEN>>` in prose is DOCUMENTATION, not a fill token; apply.py
# and the leftover-validator ignore it.

schema_version: 1

# Slugify rule shared by the derivable slug tokens:
#   lowercase -> replace any run of non [a-z0-9] with '-' -> strip leading/trailing '-'
#   -> must then satisfy ^[a-z][a-z0-9-]{0,40}$, otherwise ask instead of derive.
slugify_rule: >-
  lowercase; collapse each run of characters outside [a-z0-9] to a single '-';
  strip leading and trailing '-'; the result must match ^[a-z][a-z0-9-]{0,40}$,
  otherwise fall back to asking the principal.

# ---------------------------------------------------------------------------
# tokens — the complete onboarding allowlist (exactly six). apply.py fills only
# these; the leftover-validator flags only these.
# ---------------------------------------------------------------------------
tokens:
  - name: STORE_NAME
    meaning: The shared-context store's name.
    source: asked
    question: "What is this shared-context store called? (e.g. Alex-Shared)"
    example: Alex-Shared
    validation:
      rule: "1-60 characters, single line (no newline)."
      regex: '^[^\n]{1,60}$'

  - name: PRINCIPAL_NAME
    meaning: The principal - the person every plugged-in workspace serves.
    source: asked
    question: "Who is the principal (the person this store describes)?"
    example: Alex
    validation:
      rule: "1-60 characters, single line (no newline)."
      regex: '^[^\n]{1,60}$'

  - name: store_slug
    meaning: "Lowercase id handle (frontmatter id: prefixes)."
    source: derivable
    derive_from: STORE_NAME
    derive: slugify        # see slugify_rule; ask if it cannot be derived cleanly
    question: "Lowercase store slug (default: slugified STORE_NAME)?"
    example: alex-shared
    validation:
      rule: "Start with a letter, then lowercase letters/digits/hyphens; up to 41 chars."
      regex: '^[a-z][a-z0-9-]{0,40}$'

  - name: OBJECTION_WINDOW_HOURS
    meaning: How long an edit stays open for objection before silence means accepted.
    source: asked
    question: "Objection-window length in hours? (default 24)"
    example: "24"
    validation:
      rule: "A whole number of hours, 1-999."
      regex: '^[1-9][0-9]{0,2}$'

  - name: FILE_CAP
    meaning: Maximum content files across the content folders (growth is a decision).
    source: asked
    question: "File cap for content files? (default 30)"
    example: "30"
    validation:
      rule: "A whole number, 1-999."
      regex: '^[1-9][0-9]{0,2}$'

  - name: CREATED_DATE
    meaning: Instantiation date (YYYY-MM-DD).
    source: derivable
    derive: today          # auto-fills to today's date when not supplied
    question: "Instantiation date (default: today, YYYY-MM-DD)?"
    example: "2026-07-02"   # quoted so YAML keeps it a string, not a date object
    validation:
      rule: "ISO date YYYY-MM-DD."
      regex: '^\d{4}-\d{2}-\d{2}$'

# ---------------------------------------------------------------------------
# replacement_order — longest-name-first (belt-and-braces; the <<...>> delimiters
# already disambiguate). Ties broken alphabetically. All six tokens listed.
# ---------------------------------------------------------------------------
replacement_order:
  - OBJECTION_WINDOW_HOURS  # 22
  - PRINCIPAL_NAME          # 14
  - CREATED_DATE            # 12
  - STORE_NAME              # 10
  - store_slug              # 10
  - FILE_CAP                # 8

# ---------------------------------------------------------------------------
# validator — leftover-scan contract after apply.py runs.
# ---------------------------------------------------------------------------
validator:
  flag_only: tokens          # flag leftover <<X>> only when X is a declared token
  ignore_literals:
    - TOKEN                  # the generic <<TOKEN>> is documentation prose, not a fill token
  leave_runtime_markers: true
